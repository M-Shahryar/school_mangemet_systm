{% extends "_layout.html" %}
{% block content %}
<h2>Stock In</h2>
<form method="post" action="/admin/inventory/stationery/stock/in">
  <label>Date</label><br><input type="date" name="move_date" required><br><br>
  <label>Item</label><br>
  <select name="item_id" required>
    <option value="">-- select --</option>
    {% for it in items %}
      <option value="{{ it.id }}">{{ it.name }}{% if it.sku %} ({{ it.sku }}){% endif %}</option>
    {% endfor %}
  </select><br><br>
  <label>Qty</label><br><input type="number" step="0.01" name="qty" required><br><br>
  <label>Note</label><br><input name="note"><br><br>
  <button type="submit">Save</button>
</form>
{% endblock %}
